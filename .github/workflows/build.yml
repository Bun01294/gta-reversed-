name: Build

env:
  # Compile in parallel where possible.
  CL: /MP
  # Fix CMake 4.0+ compatibility with older subprojects
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"
  # Path to the CMake build directory.
  build: "${{ github.workspace }}/build"

# Triggers the workflow on push or pull request events for all branches.
on: [push, pull_request]

permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025-vs2026]
        arch: [x86]
        conf: [Debug, Release]
        unity: [Unity, NoUnity]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Set up Python & Conan
        shell: pwsh
        run: |
          pip install "conan>=2.0"
          conan profile detect --force

      - name: Configure and Build with Conan & CMake
        shell: pwsh
        run: |
          $unityFlag = if ("${{ matrix.unity }}" -eq "Unity") { "True" } else { "False" }
          if (Test-Path "conanfile.py" -PathType Leaf) {
            conan build . `
              -s arch=${{ matrix.arch }} `
              -s build_type=${{ matrix.conf }} `
              -s compiler.cppstd=23 `
              -o "&:unity_build=$unityFlag" `
              --build=missing
          } else {
            cmake -B build -A Win32 `
              -DCMAKE_POLICY_VERSION_MINIMUM=3.5 `
              -DGTA_SA_UNITY_BUILD=$unityFlag
            cmake --build build --config ${{ matrix.conf }} --parallel
          }

      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f3646cd9 # v7.0.2
        with:
          name: gta_reversed-${{ matrix.conf }}-${{ matrix.unity }}
          path: bin/${{ matrix.conf }}
